<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0f0f0f;
    --card: #1c1c1c;
    --line: #2a2a2a;
    --text: #f1f1f1;
    --dim: #9a9a9a;
    --accent: #ff3d3d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 300px;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none;
  }
  .hidden { display: none !important; }
  .empty { padding: 28px 16px; text-align: center; color: var(--dim); }
  button { border: 0; background: transparent; color: var(--dim); cursor: pointer; font: inherit; }
  button:hover { color: var(--text); }
  svg { display: block; }

  .hero { display: flex; gap: 10px; padding: 12px 12px 10px; }
  .hero img {
    width: 104px; height: 58px; object-fit: cover;
    border-radius: 2px; background: var(--card); flex: none;
  }
  .meta { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
  #title {
    font-weight: 600; font-size: 12.5px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  #vid { color: var(--dim); font-size: 11px; }

  .toolbar { display: flex; align-items: center; gap: 2px; margin: 0 12px 10px; }
  .segment {
    display: flex; background: var(--card); padding: 3px; gap: 3px; flex: 1;
  }
  .segment button {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 8px 0; color: var(--dim); transition: background .15s, color .15s;
  }
  .segment button svg { width: 18px; height: 18px; fill: currentColor; }
  .segment button.active { background: var(--accent); color: #fff; }
  .tool {
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; flex: none; color: var(--dim);
    transition: color .15s;
  }
  .tool svg { width: 18px; height: 18px; fill: currentColor; }
  .tool.active { color: var(--accent); }

  #sepNow {
    display: flex; align-items: center; justify-content: center;
    margin: 0 12px 10px; width: calc(100% - 24px);
    background: var(--accent); color: #fff; padding: 8px 0;
  }
  #sepNow svg { width: 16px; height: 16px; fill: currentColor; }
  #sepNow:hover { filter: brightness(1.1); }
  #sepNow.hidden { display: none; }

  #status { margin: 0 12px 10px; padding: 8px 10px; background: var(--card); }
  #statusText { font-size: 11px; color: var(--dim); margin-top: 6px; }
  .bar { height: 3px; background: #3a3a3a; overflow: hidden; }
  #fill { height: 100%; width: 0%; background: var(--accent); transition: width .3s; }

  #errtext { margin: 0 12px 10px; color: var(--accent); font-size: 11.5px; word-break: break-word; }

  #account {
    margin: 0 12px 12px;
    padding: 5px 6px;
    background: var(--card);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .acct-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
  #acctEmail {
    font-size: 11.5px; font-weight: 600; flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #acctUsageIn { font-size: 10.5px; color: var(--dim); flex: none; }
  .hint { font-size: 11px; color: var(--dim); flex: 1; }
  .iconbtn {
    width: 28px; height: 28px; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .iconbtn svg { width: 15px; height: 15px; fill: currentColor; }
  #signout:hover, #reloadTab:hover { color: var(--accent); }
</style>
</head>
<body>
  <div id="novideo" class="empty hidden">
    <div id="novideoText">Open a YouTube video</div>
    <button id="reloadTab" class="iconbtn hidden" title="Reload page">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-8 8s3.57 8 8 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
  </div>

  <div id="main" class="hidden">
    <div class="hero">
      <img id="thumb" alt="">
      <div class="meta">
        <div id="title"></div>
        <div id="vid"></div>
      </div>
    </div>

    <div class="toolbar">
      <div class="segment" id="modes">
        <button data-mode="vocals" title="Vocals only">
          <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.49 6-3.31 6-6.72h-1.7z"/></svg>
        </button>
        <button data-mode="whole" title="Original mix">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </button>
        <button data-mode="bgm" title="Music only">
          <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </button>
      </div>
      <button class="tool" id="aiBtn" title="AI separation">
        <svg viewBox="0 0 24 24"><path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"/></svg>
      </button>
      <button class="tool" id="autoBtn" title="Auto-separate">
        <svg viewBox="0 0 24 24"><path d="M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66.19-.34.05-.08.07-.12C8.48 10.94 10.42 7.54 13 3h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15C12 18.15 11 21 11 21z"/></svg>
      </button>
    </div>

    <button id="sepNow" class="hidden" title="Separate now">
      <svg viewBox="0 0 24 24"><path d="M12 16l-5-5h3V4h4v7h3l-5 5zm-7 2h14v2H5v-2z"/></svg>
    </button>

    <div id="status" class="hidden">
      <div class="bar"><div id="fill"></div></div>
      <div id="statusText"></div>
    </div>
    <div id="errtext" class="hidden"></div>
  </div>

  <div id="account">
    <div id="acctOut" class="acct-main">
      <button class="iconbtn" id="signin" title="Sign in with Google">
        <svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </button>
      <span class="hint">Sign in for more daily usage</span>
    </div>
    <div id="acctIn" class="acct-main hidden">
      <div id="acctEmail"></div>
      <div id="acctUsageIn"></div>
    </div>
    <button class="iconbtn hidden" id="signout" title="Sign out">
      <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
